<title>ドリップレシピ</title>
<style>
/* ============================================================
   Design tokens
   Ground: cool lab-paper / charcoal (blue-biased neutrals)
   Accent: follows the brew — amber for HOT, cyan for ICE
   ============================================================ */
:root {
  --bg:        #EEF0F3;
  --surface:   #FFFFFF;
  --surface-2: #E4E7EC;
  --line:      #D3D8E0;
  --line-2:    #BFC6D1;
  --ink:       #15181D;
  --ink-2:     #565D68;
  --ink-3:     #868D99;

  --hot:        #C07208;
  --hot-on:     #FFFFFF;
  --hot-text:   #935703;
  --hot-soft:   #F7E8CE;

  --ice:        #0B6BA8;
  --ice-on:     #FFFFFF;
  --ice-text:   #07548A;
  --ice-soft:   #D9E8F5;

  --shadow: 0 1px 2px rgba(21,24,29,.06), 0 6px 18px rgba(21,24,29,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0F1216;
    --surface:   #171B21;
    --surface-2: #1F252D;
    --line:      #2A313A;
    --line-2:    #3A434F;
    --ink:       #EDF0F4;
    --ink-2:     #98A0AC;
    --ink-3:     #6E7784;

    --hot:        #F0A63C;
    --hot-on:     #1A1204;
    --hot-text:   #F0A63C;
    --hot-soft:   #2E2313;

    --ice:        #56AFF0;
    --ice-on:     #04202F;
    --ice-text:   #56AFF0;
    --ice-soft:   #0F2739;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"] {
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#E4E7EC; --line:#D3D8E0; --line-2:#BFC6D1;
  --ink:#15181D; --ink-2:#565D68; --ink-3:#868D99;
  --hot:#C07208; --hot-on:#FFFFFF; --hot-text:#935703; --hot-soft:#F7E8CE;
  --ice:#0B6BA8; --ice-on:#FFFFFF; --ice-text:#07548A; --ice-soft:#D9E8F5;
  --shadow: 0 1px 2px rgba(21,24,29,.06), 0 6px 18px rgba(21,24,29,.06);
}
:root[data-theme="dark"] {
  --bg:#0F1216; --surface:#171B21; --surface-2:#1F252D; --line:#2A313A; --line-2:#3A434F;
  --ink:#EDF0F4; --ink-2:#98A0AC; --ink-3:#6E7784;
  --hot:#F0A63C; --hot-on:#1A1204; --hot-text:#F0A63C; --hot-soft:#2E2313;
  --ice:#56AFF0; --ice-on:#04202F; --ice-text:#56AFF0; --ice-soft:#0F2739;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
             "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Roboto Mono", monospace;
  --r: 14px;
  --r-sm: 10px;
  --tap: 46px;
}

/* ---------- shell ---------- */
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }

.stage {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
}
/* iPhone 16 Pro Max logical viewport: 440 x 956 pt */
.app {
  --accent: var(--hot); --on-accent: var(--hot-on);
  --accent-text: var(--hot-text); --accent-soft: var(--hot-soft);
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.app[data-brew="ice"] {
  --accent: var(--ice); --on-accent: var(--ice-on);
  --accent-text: var(--ice-text); --accent-soft: var(--ice-soft);
}
/* Desktop preview: show the phone silhouette */
@media (min-width: 520px) and (min-height: 700px) {
  .stage { padding: 24px; }
  .app {
    height: min(956px, calc(100dvh - 48px));
    border-radius: 44px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
}

/* ---------- top bar ----------
   flex なのでタイトルが左右のボタンを押し出さず、overflow:hidden で枠外にも出ない。
   対称スペーサーは置かない（ボタン幅の2倍をタイトルから奪うため）。 */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.topbar h1 {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: .02em;
}
.topbar .sub {
  font-family: var(--font-num);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.bar-btn {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}
.bar-btn:active { background: var(--surface-2); }
.bar-btn[hidden] { display: none; }

/* ---------- screens ---------- */
.screens { position: relative; flex: 1 1 auto; overflow: hidden; }
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: translateX(18px);
  transition: opacity .22s ease, transform .28s cubic-bezier(.32,.72,0,1);
}
.screen.is-active { opacity: 1; pointer-events: auto; transform: none; }
.screen.is-left { transform: translateX(-18px); }
.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- section ---------- */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; gap: 8px; }
.sec-head h2 {
  margin: 0;
  font-family: var(--font-num);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.sec-head .jp { font-size: 16px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.sec-note { margin: 0; font-size: 15px; color: var(--ink-3); line-height: 1.5; }

/* ---------- geometry groups (円錐 / 平底) ---------- */
.grp { display: flex; flex-direction: column; gap: 7px; }
.grp + .grp { margin-top: 3px; }
.grp-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--ink-3);
}
.grp-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grp[data-off="true"] .grp-label { opacity: .5; }

/* ---------- chips / segmented ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg.seg-4 { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.seg-4 button { min-height: 56px; letter-spacing: -.02em; }
.seg button {
  min-height: 60px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 19px;
  font-weight: 600;
  cursor: pointer;
}
.seg button .en {
  font-family: var(--font-num);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--ink-3);
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.seg button[aria-pressed="true"] .en { color: var(--on-accent); opacity: .72; }
.seg button[disabled] { opacity: .32; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  min-height: 42px;
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.chip:active { background: var(--surface-2); }
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}
.chip[disabled] { opacity: .3; cursor: default; }

/* ---------- tools ---------- */
.tool {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  min-height: 60px;
  padding: 10px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
}
.tool:first-child { border-top: 0; }
.tool:active { background: var(--surface-2); }
.tool[disabled] { opacity: .38; cursor: default; }
.tool .label { display: flex; flex-direction: column; gap: 2px; }
.tool .label b { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
.tool .label span {
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tool .state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink-3);
  font-size: 16px;
  font-weight: 600;
}
.tool .state::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ink-3);
}
.tool[aria-pressed="true"] .state {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.tool[aria-pressed="true"] .state::before { background: var(--on-accent); }

/* ---------- bean dial ---------- */
.dial {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dial-main { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); align-items: center; gap: 10px; }
.round {
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 25px;
  line-height: 1;
  color: var(--ink);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.round:active { background: var(--line); }
.round[disabled] { opacity: .3; cursor: default; }
.dial-read { text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.dial-read input {
  width: 4ch;
  border: 0;
  padding: 0;
  background: transparent;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 47px;
  font-weight: 600;
  letter-spacing: -.03em;
  text-align: center;
  color: var(--ink);
  -moz-appearance: textfield;
}
.dial-read input::-webkit-outer-spin-button,
.dial-read input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.dial-read .unit { font-family: var(--font-num); font-size: 19px; color: var(--ink-3); }
.dial-range {
  text-align: center;
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--ink-3);
  margin: -6px 0 0;
}
.presets { display: flex; gap: 7px; }
.presets .chip {
  flex: 1;
  padding: 8px 4px;
  text-align: center;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* ---------- CTA ---------- */
.footer {
  flex: 0 0 auto;
  padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 9px;
}
.cta {
  flex: 1;
  min-height: 52px;
  border: 0;
  border-radius: var(--r);
  background: var(--accent);
  color: var(--on-accent);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .04em;
  cursor: pointer;
}
.cta:active { filter: brightness(.93); }
.cta.secondary {
  flex: 0 0 auto;
  padding: 0 18px;
  background: var(--surface-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
  font-weight: 600;
}

/* ---------- recipe: summary tiles ---------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.tile { background: var(--surface); padding: 11px 6px 12px; text-align: center; }
.tile .k {
  font-family: var(--font-num);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tile .v {
  margin-top: 5px;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1.1;
}
.tile .v small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
.tile.accent .v { color: var(--accent-text); }

.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink-2);
}
.tag.on { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); font-weight: 600; }

/* ---------- field rows ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  min-height: 58px;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row .label { display: flex; flex-direction: column; gap: 2px; }
.row .label b { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.row .label span {
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .sq {
  width: 38px;
  height: 38px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: var(--ink);
}
.stepper .sq:active { background: var(--line); }
.stepper .sq[disabled] { opacity: .3; cursor: default; }
.stepper .val {
  min-width: 88px;
  text-align: center;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.01em;
}
.stepper .val.wide { min-width: 104px; font-size: 19px; }
.stepper .val small { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.stepper .val input {
  width: 4ch;
  border: 0;
  border-bottom: 1.5px dashed var(--line-2);
  padding: 0 0 1px;
  background: transparent;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  color: var(--ink);
  -moz-appearance: textfield;
}
.stepper .val input::-webkit-outer-spin-button,
.stepper .val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .val input:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent-text); }

/* 湯温：数値を大きく、内訳を小さく */
.readout { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.readout .big {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1.05;
}
.readout .big small { font-size: 17px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
.readout .sub {
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .02em;
  color: var(--ink-3);
}
.readout.bonus .big { color: var(--accent-text); }
.readout.bonus .sub { color: var(--accent-text); opacity: .85; }
/* 落ちきり目標は範囲表示なので一段小さく */
.readout.range .big { font-size: 26px; }

/* two-way選択（投数など） */
.seg2 {
  display: flex;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.seg2 button {
  min-width: 60px;
  height: 40px;
  padding: 0 8px;
  border: 0;
  border-left: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}
.seg2 button:first-child { border-left: 0; }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg2 button[disabled] { opacity: .32; cursor: default; }

/* ---------- pour list ---------- */
.pours { display: flex; flex-direction: column; gap: 9px; }
.pour {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 11px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.pour-top { display: flex; align-items: baseline; gap: 9px; }
.badge {
  width: 27px; height: 27px;
  flex: 0 0 auto;
  align-self: center;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-family: var(--font-num);
  font-size: 16px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.pour-top .name { font-size: 17px; font-weight: 600; }
.pour-top .pct {
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--ink-3);
}
.pour-top .spacer { flex: 1; }
/* 累計＝主役 */
.cum-k {
  font-family: var(--font-num);
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.cum-v {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -.03em;
}
.cum-v small { font-size: 16px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }

.pour-bot { display: flex; align-items: center; gap: 8px; }
.time-step { display: flex; align-items: center; gap: 5px; }
.time-step .sq {
  width: 33px; height: 33px;
  border-radius: 8px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 19px; line-height: 1;
  cursor: pointer;
  display: grid; place-items: center;
  color: var(--ink);
}
.time-step .sq:active { background: var(--line); }
/* 注湯時間は累計湯量（.cum-v）と同じ大きさ。色は抽出タイプ連動（ホット＝オレンジ／アイス＝ブルー）。 */
.time-step .t {
  min-width: 92px;
  text-align: center;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -.03em;
  /* 34px の大文字サイズなので、--accent-text より鮮やかな --accent を使える */
  color: var(--accent);
}
/* この1投＝脇役 */
.each {
  margin-left: auto;
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  font-family: var(--font-num);
  font-size: 14px;
  letter-spacing: .04em;
  color: var(--ink-3);
}
.water-in {
  width: 4.4ch;
  border: 0;
  border-bottom: 1.5px dashed var(--line-2);
  padding: 0 0 1px;
  background: transparent;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 18px;
  font-weight: 600;
  text-align: right;
  color: var(--ink-2);
  -moz-appearance: textfield;
}
.water-in::-webkit-outer-spin-button,
.water-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.water-in:focus { outline: none; border-bottom-color: var(--accent); color: var(--accent-text); }

.track { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }

<div class="stage">
<div class="app" id="app" data-brew="hot">

  <header class="topbar">
    <h1>ドリップレシピ<span class="sub" id="crumb">Setup</span></h1>
    <button class="bar-btn" id="btn-reset" hidden>リセット</button>
  </header>

  <div class="screens">

    <!-- ============ 1. INPUT ============ -->
    <section class="screen is-active" id="screen-input" aria-label="入力">
      <div class="scroll">

        <div class="sec">
          <div class="sec-head"><h2>Brew</h2><span class="jp">抽出タイプ</span></div>
          <div class="seg" id="seg-brew" role="group" aria-label="抽出タイプ">
            <button type="button" data-v="hot" aria-pressed="true">ホット<span class="en">Hot</span></button>
            <button type="button" data-v="ice" aria-pressed="false">アイス<span class="en">Iced</span></button>
          </div>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Dripper</h2><span class="jp">ドリッパー</span></div>
          <div id="dripper-groups"></div>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Paper</h2><span class="jp">ペーパー</span></div>
          <div id="paper-groups"></div>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Tools</h2><span class="jp">ツール</span></div>
          <div class="card" id="tools">
            <button type="button" class="tool" data-tool="paragon" aria-pressed="false">
              <span class="label"><b>パラゴン</b><span>Paragon · +2℃</span></span>
              <span class="state">未使用</span>
            </button>
            <button type="button" class="tool" data-tool="switch" aria-pressed="false">
              <span class="label"><b>SWITCH</b><span>Immersion</span></span>
              <span class="state">未使用</span>
            </button>
          </div>
          <p class="sec-note" id="tool-note"></p>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Temp</h2><span class="jp">湯温</span></div>
          <div class="seg seg-4" id="seg-temp" role="group" aria-label="湯温">
            <button type="button" data-v="88" aria-pressed="false">88℃</button>
            <button type="button" data-v="90" aria-pressed="false">90℃</button>
            <button type="button" data-v="92" aria-pressed="true">92℃</button>
            <button type="button" data-v="94" aria-pressed="false">94℃</button>
          </div>
          <p class="sec-note" id="temp-note"></p>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Dose</h2><span class="jp">豆量</span></div>
          <div class="dial">
            <div class="dial-main">
              <button type="button" class="round" data-dose="-1" aria-label="豆量を1g減らす">−</button>
              <div class="dial-read">
                <input id="in-beans" type="number" inputmode="numeric" step="1" value="20" aria-label="豆量（グラム）">
                <span class="unit">g</span>
              </div>
              <button type="button" class="round" data-dose="1" aria-label="豆量を1g増やす">＋</button>
            </div>
            <p class="dial-range" id="dose-range">10 – 35 g ／ 1 g STEP</p>
            <div class="presets" id="dose-presets"></div>
          </div>
        </div>

      </div>
      <div class="footer">
        <button class="cta" id="btn-go">レシピを表示</button>
      </div>
    </section>

    <!-- ============ 2. RECIPE ============ -->
    <section class="screen" id="screen-recipe" aria-label="レシピ">
      <div class="scroll">

        <div class="tiles">
          <div class="tile"><div class="k">Dose</div><div class="v" id="t-dose">20<small>g</small></div></div>
          <div class="tile"><div class="k">Water</div><div class="v" id="t-water">330<small>g</small></div></div>
          <div class="tile accent"><div class="k">Ratio</div><div class="v" id="t-ratio">16.5</div></div>
        </div>

        <div class="meta" id="meta-tags"></div>

        <div class="sec">
          <div class="sec-head"><h2>Parameters</h2><span class="jp">パラメーター</span></div>
          <div class="card" id="param-rows"></div>
        </div>

        <div class="sec">
          <div class="sec-head"><h2>Pour Schedule</h2><span class="jp" id="pour-count-jp">4投式</span></div>
          <div class="pours" id="pour-list"></div>
          <div class="total-line">
            <span>合計湯量</span>
            <b id="pour-total">330 g</b>
          </div>
        </div>

        <div class="notice">
          <span class="k">仮</span>
          <span id="notice-text"></span>
        </div>

      </div>
      <div class="footer">
        <button class="cta secondary" id="btn-back2">入力</button>
        <button class="cta" id="btn-done">レシピを確定</button>
      </div>
    </section>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* iPhone full-bleed: ensure viewport meta covers the safe areas. */
  var vp = document.querySelector('meta[name="viewport"]');
  if (!vp) {
    vp = document.createElement('meta');
    vp.name = 'viewport';
    vp.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
    document.head.appendChild(vp);
  } else if (vp.content.indexOf('viewport-fit') === -1) {
    vp.content = vp.content + ', viewport-fit=cover';
  }

  /* ==========================================================
     CATALOG
     shape : 'cone' 円錐 / 'flat' 平底
     並び順は 数字 → 英字 → 日本語（sortByName）で自動的に整列します。
     ========================================================== */
  var DRIPPERS = [
    { id: 'acid',    name: 'ACID ドリッパー',  shape: 'cone' },
    { id: 'ct62',    name: 'CT62',            shape: 'cone' },
    { id: 'v60',     name: 'V60',             shape: 'cone' },
    { id: 'v60neo',  name: 'V60 NEO',         shape: 'cone' },
    { id: 'flower',  name: 'フラワードリッパー', shape: 'cone' },
    { id: 'april',   name: 'April ドリッパー', shape: 'flat' },
    { id: 'orea-o1', name: 'Orea O1',         shape: 'flat' },
    { id: 'orea-o2', name: 'Orea O2',         shape: 'flat' },
    { id: 'orea-v4', name: 'Orea V4',         shape: 'flat' },
    { id: 'orea-z1', name: 'Orea Z1',         shape: 'flat' }
  ];

  /* ペーパーは指定された表示順をそのまま使う（並べ替えしない） */
  var PAPERS = [
    { id: 'cone',     name: '円錐',              shape: 'cone' },
    { id: 'sib-cone', name: 'Sibarist（円錐）',   shape: 'cone' },
    { id: 'wave',     name: 'ウェーブ',           shape: 'flat' },
    { id: 'flat',     name: 'フラット',           shape: 'flat' },
    { id: 'sib-flat', name: 'Sibarist（フラット）', shape: 'flat' },
    { id: 'sib-z1',   name: 'Sibarist（Z1）',     shape: 'flat' }
  ];

  var SHAPES = [{ id: 'cone', label: '円錐' }, { id: 'flat', label: '平底' }];

  /* ==========================================================
     レシピ分類
     SWITCH ON → 浸漬系。それ以外は 円錐＝ドリッパー種別 / 平底＝ペーパー で決まる。
     ========================================================== */
  var CONE_FAST = ['v60', 'v60neo', 'flower'];
  var SWITCH_OK = ['v60', 'v60neo', 'orea-o1', 'orea-o2', 'orea-v4'];

  /* 分類ごとに、配分（split）・挽き目（grind）・注湯時間（timing）の
     どのルールを使うかを指す。3つのグループ分けは互いに独立している。
     *Prov = そのルールがまだ未指定で仮置きであることの印。 */
  var CATEGORIES = [
    { id: 'immerse',      label: '浸漬系',             split: 'immerse', grind: 'immerse',  timing: 'A',
      splitProv: true, timingProv: true },
    { id: 'cone-fast',    label: '高速ドリッパー',      split: 'cone',    grind: 'fast',     timing: 'A' },
    { id: 'cone-balance', label: 'バランスドリッパー',   split: 'cone',    grind: 'balance',  timing: 'A' },
    { id: 'cone-sib',     label: 'Sibarist（円錐）',    split: 'cone',    grind: 'sibarist', timing: 'B' },
    { id: 'flat-wave',    label: 'ウェーブ',            split: 'flat',    grind: 'fast',     timing: 'B' },
    { id: 'flat-flat',    label: 'フラット',            split: 'flat',    grind: 'balance',  timing: 'A' },
    { id: 'flat-sib',     label: 'Sibarist（フラット）', split: 'flat',    grind: 'sibarist', timing: 'B' },
    { id: 'flat-z1',      label: 'Sibarist（Z1）',      split: 'z1',      grind: 'z1',       timing: 'A' }
  ];

  /* 各投の配分（％） */
  var SPLITS = {
    cone:    { 4: [20, 30, 25, 25], 5: [20, 25, 20, 20, 15] },
    flat:    { 4: [25, 25, 25, 25], 5: [20, 20, 20, 20, 20] },
    immerse: { 4: [20, 30, 25, 25], 5: [20, 25, 20, 20, 15] },  /* ★仮：円錐と同じ配分 */
    z1:      { 4: [20, 40, 25, 15] }
  };

  /* ブリューレシオ：10g を起点に 1g ごとに step ずつ増やし、cap で頭打ち */
  var RATIO = {
    hot: { base: 15.5, step: 0.1, cap: 16.5 },
    ice: { base: 15.2, step: 0.1, cap: 16.2 },
    z1:  { base: 15.0, step: 0.2, cap: 16.0 }
  };

  /* 挽き目（Varia VS6 + Kilonova DLC）：10g を起点に 1g ごとに step。
     knee を置くと、そこを超えたぶん（knee+1g 以降）が step2 になる。 */
  var GRIND = {
    fast:     { base: 11.1, step: 0.1,  knee: 20, step2: 0.05, cap: 13.2 },                    // 高速 / ウェーブ
    balance:  { base: 11.5, step: 0.1,  knee: 20, step2: 0.05, cap: 13.2 },                    // バランス / フラット
    sibarist: { base: 10.0, step: 0.2,  knee: 15, step2: 0.1,  cap: 12 },                      // Sibarist 円錐 / フラット
    z1:       { base: 9.5,  step: 0.35, cap: 99 },                                             // Orea Z1
    immerse:  { base: 11.5, step: 0.1,  knee: 20, step2: 0.05, cap: 13.2, provisional: true }  // ★未指定
  };

  /* 注湯時間（秒・スタートからの累計）。10〜20g が基準で、
     21g以降は2投目以降に各 +5秒（1投目は常に 0:00）。 */
  var TIMING = {
    A: { 4: [0, 30, 65, 100], 5: [0, 30, 60, 85, 105] },  // フラット / 高速 / バランス / Z1
    B: { 4: [0, 30, 60,  90], 5: [0, 30, 60, 80, 100] }   // ウェーブ / Sibarist（円錐・フラット）
  };
  var TIMING_TIER = 5;   // 豆量帯ごとの加算秒

  /* 落ちきり目標（秒）。分類によらず豆量帯だけで決まる。 */
  var DRAWDOWN = [
    { min: 140, max: 160 },   // 10〜15g : 2:20 – 2:40
    { min: 180, max: 200 },   // 16〜20g : 3:00 – 3:20
    { min: 210, max: 240 }    // 21g以降 : 3:30 – 4:00
  ];

  var RULES = {
    paragonTempBonus: 2    // パラゴン使用時の湯温加算
  };

  /* Orea Z1 の制約：豆量 10〜15g / 4投のみ / ホットのみ */
  var Z1 = { dripper: 'orea-z1', paper: 'sib-z1', min: 10, max: 15, pours: 4 };
  var DOSE = { min: 10, max: 35 };
  var DOSE_PRESETS = [10, 15, 20, 25, 30];

  /* ==========================================================
     STATE
     ========================================================== */
  var input = {
    brew: 'hot',
    dripper: 'v60',
    paper: 'cone',
    tools: { paragon: false, switch: false },
    temp: 92,
    pours: 4,
    beans: 20
  };
  var recipe = null;     // 表示中（手動編集が入りうる）
  var setupBeans = null; // 画面1で確定した豆量。リセットの戻り先。

  /* ==========================================================
     HELPERS
     ========================================================== */
  function $(s) { return document.querySelector(s); }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return list[0]; }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function sumW(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i].w; return s; }
  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function round1(v) { return Math.round(v * 10) / 10; }
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  /* 数字 → 英字 → 日本語 の順 */
  function nameRank(s) {
    var c = s.charAt(0);
    if (c >= '0' && c <= '9') return 0;
    if (/[A-Za-z]/.test(c)) return 1;
    return 2;
  }
  function sortByName(a, b) {
    var ra = nameRank(a.name), rb = nameRank(b.name);
    if (ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name, 'ja');
  }

  /* ==========================================================
     CONSTRAINTS
     ========================================================== */
  function isZ1(dripperId) { return dripperId === Z1.dripper; }
  function switchUsable(dripperId) { return SWITCH_OK.indexOf(dripperId) >= 0; }
  function beansRange() { return isZ1(input.dripper) ? [Z1.min, Z1.max] : [DOSE.min, DOSE.max]; }
  function poursUsable(n) { return !(isZ1(input.dripper) && n !== Z1.pours); }
  function iceUsable() { return !isZ1(input.dripper); }

  function paperUsable(p, dripperId) {
    var d = byId(DRIPPERS, dripperId);
    if (p.shape !== d.shape) return false;
    if (isZ1(dripperId)) return p.id === Z1.paper;      // Z1 は専用フィルターのみ
    if (p.id === Z1.paper) return false;                // Z1 専用フィルターは他では使えない
    if (dripperId === 'april') return p.id === 'wave';  // April はウェーブのみ
    return true;
  }

  /* 選択の組み合わせが常に成立するよう整える */
  function reconcile() {
    if (!switchUsable(input.dripper)) input.tools.switch = false;
    if (!iceUsable()) input.brew = 'hot';
    if (!paperUsable(byId(PAPERS, input.paper), input.dripper)) {
      for (var i = 0; i < PAPERS.length; i++) {
        if (paperUsable(PAPERS[i], input.dripper)) { input.paper = PAPERS[i].id; break; }
      }
    }
    if (!poursUsable(input.pours)) input.pours = Z1.pours;
    var r = beansRange();
    input.beans = clamp(input.beans, r[0], r[1]);
  }

  /* ==========================================================
     RECIPE RULES
     ========================================================== */
  function resolveCategory(inp) {
    if (inp.tools.switch && switchUsable(inp.dripper)) return byId(CATEGORIES, 'immerse');
    var d = byId(DRIPPERS, inp.dripper);
    var id;
    if (d.shape === 'cone') {
      /* Sibarist は挽き目が別系統なので、ドリッパー種別より優先する */
      if (inp.paper === 'sib-cone') id = 'cone-sib';
      else id = CONE_FAST.indexOf(inp.dripper) >= 0 ? 'cone-fast' : 'cone-balance';
    } else if (isZ1(inp.dripper)) {
      id = 'flat-z1';
    } else if (inp.paper === 'wave') {
      id = 'flat-wave';
    } else if (inp.paper === 'sib-flat') {
      id = 'flat-sib';
    } else {
      id = 'flat-flat';
    }
    return byId(CATEGORIES, id);
  }

  /* 10g を起点に 1g ごとに step、cap で頭打ち。
     knee 以降は step2 に切り替わる（2段勾配）。
     表示は小数第1位まで。0.35 のような刻みは浮動小数の誤差が乗って
     四捨五入の向きが変わるので、一度小数第2位で均してから丸める。 */
  function ramp(t, beans) {
    var v = t.base;
    if (t.knee != null) {
      v += (Math.min(beans, t.knee) - 10) * t.step;
      if (beans > t.knee) v += (beans - t.knee) * t.step2;
    } else {
      v += (beans - 10) * t.step;
    }
    return round1(Math.round(Math.min(t.cap, v) * 100) / 100);
  }

  function ratioFor(cat, beans, iced) {
    return ramp(cat.id === 'flat-z1' ? RATIO.z1 : (iced ? RATIO.ice : RATIO.hot), beans);
  }
  function grindFor(cat, beans) { return ramp(GRIND[cat.grind], beans); }

  /* 豆量帯は用途で段の切り方が違う */
  function drawdownTier(beans) { return beans < 16 ? 0 : (beans < 21 ? 1 : 2); }  // 10〜15 / 16〜20 / 21〜
  function timingTier(beans)   { return beans < 21 ? 0 : 1; }                     // 10〜20 / 21〜

  function timesFor(cat, n, beans) {
    var base = (TIMING[cat.timing] || TIMING.A)[n];
    if (!base) return null;
    var add = timingTier(beans) * TIMING_TIER;
    return base.map(function (t, i) { return i === 0 ? 0 : t + add; });
  }

  /* 総湯量を配分％で割り振る。端数は最終投で吸収。 */
  function distribute(total, split, times) {
    var out = [], acc = 0;
    for (var i = 0; i < split.length; i++) {
      var w = (i === split.length - 1) ? Math.round(total - acc) : Math.round(total * split[i] / 100);
      acc += w;
      out.push({ w: w, t: times[i], pct: split[i] });
    }
    return out;
  }

  function buildRecipe(inp) {
    var cat = resolveCategory(inp);
    var iced = inp.brew === 'ice';
    var n = cat.split === 'z1' ? Z1.pours : inp.pours;
    var water = Math.round(inp.beans * ratioFor(cat, inp.beans, iced));

    return {
      beans: inp.beans,
      brew: inp.brew,
      paragon: inp.tools.paragon,
      immersion: inp.tools.switch,
      dripper: inp.dripper,
      paper: inp.paper,
      category: cat.id,
      baseTemp: inp.temp,
      temp: inp.temp + (inp.tools.paragon ? RULES.paragonTempBonus : 0),
      grind: grindFor(cat, inp.beans),
      drawdown: DRAWDOWN[drawdownTier(inp.beans)],
      pours: distribute(water, SPLITS[cat.split][n], timesFor(cat, n, inp.beans))
    };
  }

  /* ==========================================================
     INPUT SCREEN
     ========================================================== */
  function buildGroups(host, list, sorted, isOn, isUsable) {
    host.innerHTML = '';
    SHAPES.forEach(function (shape) {
      var items = list.filter(function (x) { return x.shape === shape.id; });
      if (sorted) items = items.slice().sort(sortByName);
      if (!items.length) return;

      var grp = el('div', 'grp');
      grp.dataset.shape = shape.id;
      grp.appendChild(el('div', 'grp-label', shape.label));

      var chips = el('div', 'chips');
      items.forEach(function (item) {
        var b = el('button', 'chip', item.name);
        b.type = 'button';
        b.dataset.v = item.id;
        b.setAttribute('aria-pressed', String(isOn(item)));
        b.disabled = !isUsable(item);
        chips.appendChild(b);
      });
      grp.appendChild(chips);
      host.appendChild(grp);
    });
  }

  (function initPresets() {
    var host = $('#dose-presets');
    DOSE_PRESETS.forEach(function (g) {
      var b = el('button', 'chip', g);
      b.type = 'button';
      b.dataset.v = g;
      host.appendChild(b);
    });
  })();

  function renderInput() {
    reconcile();
    $('#app').dataset.brew = input.brew;

    Array.prototype.forEach.call($('#seg-brew').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.v === input.brew));
      b.disabled = (b.dataset.v === 'ice') && !iceUsable();
    });

    buildGroups($('#dripper-groups'), DRIPPERS, true,
      function (x) { return x.id === input.dripper; },
      function () { return true; });

    buildGroups($('#paper-groups'), PAPERS, false,
      function (x) { return x.id === input.paper; },
      function (x) { return paperUsable(x, input.dripper); });

    var shape = byId(DRIPPERS, input.dripper).shape;
    Array.prototype.forEach.call($('#paper-groups').children, function (g) {
      g.dataset.off = String(g.dataset.shape !== shape);
    });

    Array.prototype.forEach.call($('#tools').children, function (b) {
      var key = b.dataset.tool;
      var ok = key === 'switch' ? switchUsable(input.dripper) : true;
      var on = !!input.tools[key];
      b.disabled = !ok;
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('.state').textContent = ok ? (on ? '使用中' : '未使用') : '対象外';
    });
    $('#tool-note').textContent = switchUsable(input.dripper)
      ? 'SWITCH を使うと浸漬系レシピになります。'
      : 'SWITCH は V60 / V60 NEO / Orea O1・O2・V4 で使用できます。';

    Array.prototype.forEach.call($('#seg-temp').children, function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.v) === input.temp));
    });
    $('#temp-note').textContent = input.tools.paragon
      ? 'パラゴン使用中：レシピは ' + (input.temp + RULES.paragonTempBonus) + '℃ で表示されます。'
      : 'パラゴン使用時は自動で +2℃ になります。';

    var r = beansRange();
    $('#in-beans').value = String(input.beans);
    $('#in-beans').min = String(r[0]);
    $('#in-beans').max = String(r[1]);
    $('#dose-range').textContent = r[0] + ' – ' + r[1] + ' g ／ 1 g STEP';
    document.querySelectorAll('[data-dose]').forEach(function (b) {
      var next = Math.round(input.beans) + Number(b.dataset.dose);
      b.disabled = next < r[0] || next > r[1];
    });
    Array.prototype.forEach.call($('#dose-presets').children, function (b) {
      var v = Number(b.dataset.v);
      b.disabled = v < r[0] || v > r[1];
      b.setAttribute('aria-pressed', String(v === input.beans));
    });
  }

  $('#seg-brew').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    input.brew = b.dataset.v;
    renderInput();
  });

  $('#dripper-groups').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    input.dripper = b.dataset.v;
    renderInput();
  });

  $('#paper-groups').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    input.paper = b.dataset.v;
    renderInput();
  });

  $('#tools').addEventListener('click', function (e) {
    var b = e.target.closest('.tool');
    if (!b || b.disabled) return;
    input.tools[b.dataset.tool] = !input.tools[b.dataset.tool];
    renderInput();
  });

  $('#seg-temp').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    input.temp = Number(b.dataset.v);
    renderInput();
  });

  document.querySelectorAll('[data-dose]').forEach(function (b) {
    b.addEventListener('click', function () {
      var r = beansRange();
      input.beans = clamp(Math.round(input.beans) + Number(b.dataset.dose), r[0], r[1]);
      renderInput();
    });
  });

  $('#dose-presets').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b || b.disabled) return;
    input.beans = Number(b.dataset.v);
    renderInput();
  });

  $('#in-beans').addEventListener('change', function () {
    var r = beansRange();
    var v = parseFloat(this.value);
    input.beans = isNaN(v) ? r[0] : clamp(Math.round(v), r[0], r[1]);
    renderInput();
  });

  /* ==========================================================
     RECIPE SCREEN
     ========================================================== */
  function paramRow(label, sub, controlNode) {
    var r = el('div', 'row');
    var l = el('div', 'label');
    l.appendChild(el('b', null, label));
    l.appendChild(el('span', null, sub));
    r.appendChild(l);
    r.appendChild(controlNode);
    return r;
  }

  function stepper(text, onMinus, onPlus, wide) {
    var s = el('div', 'stepper');
    var m = el('button', 'sq', '−'); m.type = 'button'; m.setAttribute('aria-label', '減らす');
    var v = el('div', 'val' + (wide ? ' wide' : ''), text);
    var p = el('button', 'sq', '＋'); p.type = 'button'; p.setAttribute('aria-label', '増やす');
    m.addEventListener('click', onMinus);
    p.addEventListener('click', onPlus);
    s.appendChild(m); s.appendChild(v); s.appendChild(p);
    return s;
  }

  /* 中央が直接入力できるステッパー（豆量用・0.1g刻み） */
  function stepperInput(value, unit, step, range, onSet) {
    var s = el('div', 'stepper');
    var m = el('button', 'sq', '−'); m.type = 'button'; m.setAttribute('aria-label', '減らす');
    var v = el('div', 'val');
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.inputMode = 'decimal';
    inp.step = String(step);
    inp.min = String(range[0]);
    inp.max = String(range[1]);
    inp.value = fmt(value);
    inp.setAttribute('aria-label', '豆量（グラム）');
    v.appendChild(inp);
    v.appendChild(el('small', null, unit));
    var p = el('button', 'sq', '＋'); p.type = 'button'; p.setAttribute('aria-label', '増やす');
    m.disabled = value <= range[0];
    p.disabled = value >= range[1];
    m.addEventListener('click', function () { onSet(value - step); });
    p.addEventListener('click', function () { onSet(value + step); });
    inp.addEventListener('change', function () {
      var n = parseFloat(inp.value);
      onSet(isNaN(n) ? value : n);
    });
    s.appendChild(m); s.appendChild(v); s.appendChild(p);
    return s;
  }

  /* ルールで決まる値の固定表示（編集不可） */
  function fixedValue(text, variant) {
    var w = el('div', 'readout' + (variant ? ' ' + variant : ''));
    w.appendChild(el('div', 'big', text));
    return w;
  }

  /* 湯温：合算値を大きく、内訳を小さく（編集不可） */
  function tempReadout(r) {
    var w = el('div', 'readout' + (r.paragon ? ' bonus' : ''));
    w.appendChild(el('div', 'big', r.temp + '<small>℃</small>'));
    w.appendChild(el('div', 'sub', r.paragon
      ? r.baseTemp + '℃ ＋ パラゴン ' + RULES.paragonTempBonus + '℃'
      : 'パラゴン未使用'));
    return w;
  }

  function segTwo(options, current, onPick) {
    var s = el('div', 'seg2');
    options.forEach(function (o) {
      var b = el('button', null, o.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(o.v === current));
      b.disabled = !!o.disabled;
      b.addEventListener('click', function () { if (!o.disabled) onPick(o.v); });
      s.appendChild(b);
    });
    return s;
  }

  function totalWater() { return sumW(recipe.pours); }

  function rebuild() {
    reconcile();
    recipe = buildRecipe(input);
    renderRecipe();
  }

  function setBeans(v) {
    var r = beansRange();
    input.beans = clamp(Math.round(v * 10) / 10, r[0], r[1]);
    rebuild();
  }

  function setPourCount(n) {
    if (!poursUsable(n)) return;
    input.pours = n;
    var cat = byId(CATEGORIES, recipe.category);
    var split = SPLITS[cat.split][n];
    var times = timesFor(cat, n, recipe.beans);
    if (!split || !times) return;
    recipe.pours = distribute(totalWater(), split, times);
    renderRecipe();
  }

  /* レシオ変更 → 各投の配分％を保ったまま総湯量を振り直す */
  function setRatio(next) {
    next = clamp(round1(next), 8, 25);
    var pct = recipe.pours.map(function (p) { return p.pct; });
    var times = recipe.pours.map(function (p) { return p.t; });
    recipe.pours = distribute(Math.round(recipe.beans * next), pct, times);
    renderRecipe();
  }

  function renderRecipe() {
    $('#app').dataset.brew = recipe.brew;

    var cat = byId(CATEGORIES, recipe.category);
    var d = byId(DRIPPERS, recipe.dripper);
    var p = byId(PAPERS, recipe.paper);
    var water = totalWater();
    var ratio = recipe.beans > 0 ? water / recipe.beans : 0;

    $('#t-dose').innerHTML = fmt(recipe.beans) + '<small>g</small>';
    $('#t-water').innerHTML = water + '<small>g</small>';
    $('#t-ratio').textContent = ratio.toFixed(1);

    var tags = $('#meta-tags');
    tags.innerHTML = '';
    tags.appendChild(el('span', 'tag on', recipe.brew === 'ice' ? 'アイス' : 'ホット'));
    tags.appendChild(el('span', 'tag on',
      (d.shape === 'cone' ? '円錐' : '平底') + '・' + cat.label));
    tags.appendChild(el('span', 'tag', d.name));
    tags.appendChild(el('span', 'tag', p.name));
    if (recipe.paragon) tags.appendChild(el('span', 'tag on', 'パラゴン'));
    if (recipe.immersion) tags.appendChild(el('span', 'tag on', 'SWITCH'));

    /* --- parameter rows --- */
    var range = beansRange();
    var rows = $('#param-rows');
    rows.innerHTML = '';

    rows.appendChild(paramRow('豆量', 'Dose · 0.1 g',
      stepperInput(recipe.beans, 'g', 0.1, range, setBeans)));

    rows.appendChild(paramRow('ブリューレシオ', 'Brew Ratio',
      stepper('1 : ' + ratio.toFixed(1),
        function () { setRatio(ratio - 0.1); },
        function () { setRatio(ratio + 0.1); }, true)));

    rows.appendChild(paramRow('湯温', 'Temperature', tempReadout(recipe)));

    rows.appendChild(paramRow('投数', 'Pours',
      segTwo([
        { v: 4, label: '4投', disabled: !poursUsable(4) },
        { v: 5, label: '5投', disabled: !poursUsable(5) }
      ], recipe.pours.length, setPourCount)));

    rows.appendChild(paramRow('挽き目', 'Varia VS6 · Kilonova DLC',
      fixedValue(recipe.grind.toFixed(1))));

    rows.appendChild(paramRow('落ちきり目標', 'Drawdown',
      fixedValue(mmss(recipe.drawdown.min) + '–' + mmss(recipe.drawdown.max), 'range')));

    /* --- pours: 累計が主役、1投ぶんは脇役 --- */
    $('#pour-count-jp').textContent = recipe.pours.length + '投式';
    var list = $('#pour-list');
    list.innerHTML = '';
    var cum = 0;

    recipe.pours.forEach(function (pour, i) {
      cum += pour.w;
      var cumNow = cum;
      var card = el('div', 'pour');

      var top = el('div', 'pour-top');
      top.appendChild(el('span', 'badge', String(i + 1)));
      top.appendChild(el('span', 'name', (i + 1) + '投目'));
      top.appendChild(el('span', 'pct', pour.pct + '%'));
      top.appendChild(el('span', 'spacer'));
      top.appendChild(el('span', 'cum-k', '累計'));
      top.appendChild(el('span', 'cum-v', cumNow + '<small>g</small>'));
      card.appendChild(top);

      var bot = el('div', 'pour-bot');
      var ts = el('div', 'time-step');
      var tm = el('button', 'sq', '−'); tm.type = 'button';
      tm.setAttribute('aria-label', (i + 1) + '投目の時間を5秒早める');
      var tv = el('div', 't', mmss(pour.t));
      var tp = el('button', 'sq', '＋'); tp.type = 'button';
      tp.setAttribute('aria-label', (i + 1) + '投目の時間を5秒遅らせる');
      tm.addEventListener('click', function () { pour.t = clamp(pour.t - 5, 0, 1200); renderRecipe(); });
      tp.addEventListener('click', function () { pour.t = clamp(pour.t + 5, 0, 1200); renderRecipe(); });
      ts.appendChild(tm); ts.appendChild(tv); ts.appendChild(tp);
      bot.appendChild(ts);

      var each = el('div', 'each');
      each.appendChild(el('span', null, 'この投'));
      var wi = document.createElement('input');
      wi.type = 'number';
      wi.className = 'water-in';
      wi.inputMode = 'decimal';
      wi.step = '1';
      wi.min = '0';
      wi.value = String(pour.w);
      wi.setAttribute('aria-label', (i + 1) + '投目の湯量（グラム）');
      wi.addEventListener('change', function () {
        var v = parseFloat(wi.value);
        pour.w = isNaN(v) ? 0 : clamp(Math.round(v), 0, 2000);
        renderRecipe();
      });
      each.appendChild(wi);
      each.appendChild(el('span', null, 'g'));
      bot.appendChild(each);
      card.appendChild(bot);

      /* バーは累計の進捗 */
      var track = el('div', 'track');
      var fill = el('i');
      fill.style.width = (water > 0 ? (cumNow / water) * 100 : 0) + '%';
      track.appendChild(fill);
      card.appendChild(track);

      list.appendChild(card);
    });

    $('#pour-total').textContent = water + ' g';

    var fixed = ['豆量', 'ブリューレシオ', '湯温', '落ちきり目標'];
    var pending = [];
    (GRIND[cat.grind].provisional ? pending : fixed).push('挽き目');
    (cat.timingProv ? pending : fixed).push('注湯時間');
    (cat.splitProv  ? pending : fixed).push('配分％');
    var notice = $('#notice-text');
    notice.parentElement.hidden = pending.length === 0;
    notice.innerHTML = pending.length
      ? fixed.join('・') + ' は設定したルールどおりです。<b>'
        + pending.join('／') + '</b> はまだ仮の値です（分類：' + cat.label + '）。'
      : '';
  }

  /* ==========================================================
     NAVIGATION
     ========================================================== */
  function show(which) {
    var inputScreen = $('#screen-input');
    var recipeScreen = $('#screen-recipe');
    var toRecipe = which === 'recipe';
    inputScreen.classList.toggle('is-active', !toRecipe);
    inputScreen.classList.toggle('is-left', toRecipe);
    recipeScreen.classList.toggle('is-active', toRecipe);

    $('#btn-reset').hidden = !toRecipe;
    $('#crumb').textContent = toRecipe ? 'Recipe' : 'Setup';
    (toRecipe ? recipeScreen : inputScreen).querySelector('.scroll').scrollTop = 0;
  }

  $('#btn-go').addEventListener('click', function () {
    setupBeans = input.beans;
    rebuild();
    show('recipe');
  });
  $('#btn-back2').addEventListener('click', function () { renderInput(); show('input'); });

  /* リセット：豆量を画面1の値に、投数を4投に戻し、ルールから組み直す。
     ブリューレシオ・挽き目・注湯時間・各投の手動編集もすべて破棄される。 */
  $('#btn-reset').addEventListener('click', function () {
    if (setupBeans == null) return;
    input.beans = setupBeans;
    input.pours = 4;
    rebuild();
  });

  $('#btn-done').addEventListener('click', function () {
    var b = $('#btn-done');
    var was = b.textContent;
    b.textContent = '確定しました';
    setTimeout(function () { b.textContent = was; }, 1400);
  });

  renderInput();
})();
</script>
